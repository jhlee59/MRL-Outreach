<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Project</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#16212b;--muted:#5d6b78;--line:#d9e0e6;--accent:#0f6b6b}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--surface:#17212a;--ink:#e6edf3;--muted:#93a1ad;--line:#2a3743;--accent:#5cc7c0}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.head{max-width:960px;margin:0 auto;padding:20px 20px 0}
h1.site{margin:0;font-size:1.6rem;line-height:1.2;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:16px;scrollbar-width:thin}
nav a{flex:none;padding:10px 14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;font-weight:500}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{max-width:960px;margin:0 auto;padding:28px 20px 64px}
#view{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 32px}
#view.wide{padding:0;overflow:hidden}
#view h1,#view h2,#view h3{line-height:1.25;letter-spacing:-.01em}
#view>:first-child{margin-top:0}
#view>:last-child{margin-bottom:0}
#view p,#view li{max-width:70ch}
#view a{color:var(--accent)}
#view img{max-width:100%;height:auto}
#view pre{background:var(--bg);padding:14px;overflow-x:auto;border-radius:4px}
#view code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
#view table{border-collapse:collapse;display:block;overflow-x:auto}
#view th,#view td{border:1px solid var(--line);padding:6px 12px}
iframe{width:100%;height:80vh;border:0;display:block;background:#fff}
.note{color:var(--muted)}
@media (max-width:600px){#view{padding:20px}}
</style>
</head>
<body>
<header>
  <div class="head">
    <h1 class="site" id="title">My Project</h1>
    <p class="sub" id="subtitle"></p>
    <nav id="tabs" aria-label="Pages"></nav>
  </div>
</header>
<main><div id="view" aria-live="polite">Loading…</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const TYPES = {md:'md',markdown:'md',html:'frame',htm:'frame',pdf:'frame',txt:'txt',
  png:'img',jpg:'img',jpeg:'img',gif:'img',webp:'img',svg:'img'};
let folder = 'pages';

const extOf = f => f.split('.').pop().toLowerCase();
const labelOf = f => f.replace(/\.[^.]+$/, '').replace(/^\d+[-_. ]+/, '').replace(/[-_]+/g, ' ');

async function loadConfig() {
  try { return await (await fetch('site.json', {cache:'no-cache'})).json(); }
  catch (e) { return {}; }
}

function repoInfo(cfg) {
  if (cfg.repo) { const [owner, repo] = cfg.repo.split('/'); return {owner, repo, branch: cfg.branch}; }
  const h = location.hostname;
  if (!h.endsWith('.github.io')) return null;
  const seg = location.pathname.split('/')[1];
  return {owner: h.split('.')[0], repo: (!seg || seg.includes('.')) ? h : seg, branch: cfg.branch};
}

async function listFiles(cfg) {
  const info = repoInfo(cfg);
  if (info) {
    try {
      let url = `https://api.github.com/repos/${info.owner}/${info.repo}/contents/${folder}`;
      if (info.branch) url += `?ref=${info.branch}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      return (await r.json()).filter(i => i.type === 'file').map(i => i.name);
    } catch (e) { /* fall back to the files list in site.json */ }
  }
  return cfg.files || [];
}

async function show(file) {
  const view = $('#view'), type = TYPES[extOf(file)], src = `${folder}/${encodeURIComponent(file)}`;
  view.classList.toggle('wide', type === 'frame');
  document.querySelectorAll('#tabs a').forEach(a =>
    a.dataset.file === file ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (type === 'frame') { view.innerHTML = `<iframe src="${src}" title="${labelOf(file)}"></iframe>`; return; }
  if (type === 'img')   { view.innerHTML = `<img src="${src}" alt="${labelOf(file)}">`; return; }
  try {
    const res = await fetch(src); if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    if (type === 'txt') { view.innerHTML = ''; const pre = document.createElement('pre'); pre.textContent = text; view.append(pre); return; }
    view.innerHTML = DOMPurify.sanitize(marked.parse(text));
    view.querySelectorAll('img,a').forEach(el => {
      const attr = el.tagName === 'IMG' ? 'src' : 'href', v = el.getAttribute(attr);
      if (v && !/^([a-z][a-z0-9+.-]*:|#|\/)/i.test(v)) el.setAttribute(attr, `${folder}/${v}`);
    });
  } catch (e) {
    view.innerHTML = `<p class="note">Couldn’t load <strong>${file}</strong>. Check that the file is in the <code>${folder}</code> folder.</p>`;
  }
}

(async function init() {
  const cfg = await loadConfig();
  folder = cfg.folder || 'pages';
  if (cfg.title) { $('#title').textContent = cfg.title; document.title = cfg.title; }
  $('#subtitle').textContent = cfg.subtitle || '';
  if (cfg.accent) document.documentElement.style.setProperty('--accent', cfg.accent);

  const files = (await listFiles(cfg))
    .filter(f => !f.startsWith('.') && TYPES[extOf(f)])
    .sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));

  if (!files.length) {
    $('#view').innerHTML = `<p>No pages yet. Add a file to the <code>${folder}</code> folder (Markdown, HTML, PDF, image or text) and it will show up as a tab.</p>`;
    return;
  }
  const nav = $('#tabs');
  files.forEach(f => {
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(f);
    a.dataset.file = f;
    a.textContent = (cfg.labels && cfg.labels[f]) || labelOf(f);
    nav.append(a);
  });
  const route = () => {
    const want = decodeURIComponent(location.hash.slice(1));
    show(files.includes(want) ? want : files[0]);
  };
  addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
